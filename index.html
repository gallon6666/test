<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>星轨收集者</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <div class="screen-vignette" aria-hidden="true"></div>
      <header class="hud" aria-label="游戏状态">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>STARLINE 07</span>
        </div>
        <div class="stats">
          <span class="stat">分数 <strong id="score">0</strong></span>
          <span class="stat">等级 <strong id="level">1</strong></span>
          <span class="stat">生命 <strong id="lives">3</strong></span>
          <span class="stat">最佳 <strong id="best">0</strong></span>
        </div>
        <div class="hud-actions">
          <button id="pauseButton" class="icon-button" type="button" title="暂停" aria-label="暂停">
            <span aria-hidden="true">II</span>
          </button>
          <button id="restartButton" class="icon-button" type="button" title="重开" aria-label="重开">
            <span aria-hidden="true">↻</span>
          </button>
        </div>
      </header>

      <canvas id="gameCanvas" aria-label="星轨收集者游戏画面"></canvas>

      <section id="startPanel" class="overlay-panel" aria-live="polite">
        <span class="panel-kicker">NOVA RUN</span>
        <h1>星轨收集者</h1>
        <p>夜航开始，保持航线。</p>
        <button id="startButton" class="primary-button" type="button">开始巡航</button>
      </section>

      <section id="gameOverPanel" class="overlay-panel is-hidden" aria-live="polite">
        <span class="panel-kicker">RUN COMPLETE</span>
        <h2>本轮结束</h2>
        <p>得分 <strong id="finalScore">0</strong></p>
        <button id="againButton" class="primary-button" type="button">再来一局</button>
      </section>

      <section id="supportPanel" class="support-panel is-hidden" aria-live="polite" aria-modal="true">
        <div class="support-card">
          <div class="support-header">
            <span class="panel-kicker">AI PAY BOOST</span>
            <button id="supportCloseButton" class="icon-button" type="button" title="关闭" aria-label="关闭">
              <span aria-hidden="true">×</span>
            </button>
          </div>
          <h2>补给建议</h2>
          <p id="aiBoostMessage">航线稳定，继续推进。</p>
          <div class="tip-options" aria-label="打赏选项">
            <button class="tip-button" type="button" data-tip="2">¥2</button>
            <button class="tip-button" type="button" data-tip="6">¥6</button>
            <button class="tip-button" type="button" data-tip="18">¥18</button>
          </div>
          <p id="tipStatus" class="tip-status">模拟支付，不产生真实交易。</p>
          <button id="supportContinueButton" class="secondary-button" type="button">继续航行</button>
        </div>
      </section>

      <nav class="touch-controls" aria-label="移动控制">
        <button id="leftButton" class="touch-button" type="button" title="向左" aria-label="向左">‹</button>
        <button id="rightButton" class="touch-button" type="button" title="向右" aria-label="向右">›</button>
      </nav>
    </main>

    <script src="game.js"></script>
  </body>
</html>
